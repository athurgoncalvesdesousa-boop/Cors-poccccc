<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CORS PoC</title>
</head>
<body>
  <h1>CORS PoC</h1>
  <pre id="result">Testando...</pre>

  <script>
    const endpoint =
      "https://login.portswigger.net/forms/api/forms/ap_gFDHkUmP82ufvTtvQLPVFx/validations/$start";

    fetch(endpoint, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        formData: {},
        metaData: {}
      })
    })
    .then(async response => {
      const body = await response.text();

      document.getElementById("result").textContent =
        "HTTP: " + response.status +
        "\n\nResposta:\n" + body;
    })
    .catch(error => {
      document.getElementById("result").textContent =
        "FETCH/CORS ERROR:\n\n" + error;
    });
  </script>
</body>
</html>
