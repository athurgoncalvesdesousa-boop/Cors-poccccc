<!DOCTYPE html>
<html>
<body>
<h2>CORS PoC</h2>
<pre id="out">Testando...</pre>

<script>
fetch("https://rpc.drpc.testnet.arc.network/", {
    method: "POST",
    headers: {
        "Content-Type": "application/json"
    },
    body: JSON.stringify({
        jsonrpc: "2.0",
        id: 1,
        method: "eth_chainId",
        params: []
    })
})
.then(async r => {
    const text = await r.text();
    document.getElementById("out").textContent =
        "STATUS: " + r.status + "\n\n" + text;
})
.catch(e => {
    document.getElementById("out").textContent =
        "ERRO: " + e;
});
</script>
</body>
</html>
