<!doctype html>
<html>
<body>
<h2>CORS PoC</h2>
<pre id="out">Carregando...</pre>

<script>
fetch("COLE_AQUI_A_URL_DO_ENDPOINT")
  .then(r => r.text())
  .then(data => {
    document.getElementById("out").textContent = data;
  })
  .catch(e => {
    document.getElementById("out").textContent =
      "Erro/CORS: " + e;
  });
</script>
</body>
</html>
