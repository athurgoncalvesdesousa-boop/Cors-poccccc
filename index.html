<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>CORS Test - Arc Testnet</title>
</head>
<body>
  <h2>Arc Testnet CORS Test</h2>
  <pre id="result">Testando...</pre>

  <script>
    const result = document.getElementById("result");

    fetch("https://explorer.testnet.arc.io/api/account/v2/user/info", {
      method: "GET",
      credentials: "include"
    })
    .then(async response => {
      const text = await response.text();

      result.textContent =
        "HTTP: " + response.status +
        "\n\nCORS READ SUCCESS\n\n" +
        text;
    })
    .catch(error => {
      result.textContent =
        "CORS READ FAILED\n\n" +
        error;
    });
  </script>
</body>
</html>
