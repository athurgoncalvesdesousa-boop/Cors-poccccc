<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>CORS PoC</title>
</head>
<body>
  <h2>CORS PoC</h2>
  <pre id="out">Testando...</pre>

<script>
const out = document.getElementById("out");

const url = "COLE_AQUI_A_URL_EXATA_DA_REQUISICAO";

fetch(url, {
  method: "GET"
})
.then(async response => {
  const body = await response.text();

  out.textContent =
    "HTTP: " + response.status +
    "\n\n" +
    body;
})
.catch(error => {
  out.textContent = "CORS bloqueou ou a requisição falhou:\n" + error;
});
</script>
</body>
</html>
