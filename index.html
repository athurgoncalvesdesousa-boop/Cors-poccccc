<!doctype html>
<html>
<body>
<h2>Arc CORS diagnostic</h2>
<pre id="r">Testing...</pre>

<script>
fetch("https://explorer.testnet.arc.io/api/account/v2/user/info", {
  credentials: "include"
})
.then(async r => {
  document.getElementById("r").textContent =
    "STATUS: " + r.status + "\n\n" +
    await r.text();
})
.catch(e => {
  document.getElementById("r").textContent =
    "FETCH ERROR:\n" + e;
});
</script>
